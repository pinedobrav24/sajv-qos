
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout('Gestión de Sedes', ~{::contenido})}">

<body>

<div th:fragment="contenido">

    <!-- ================================================= -->
    <!-- ENCABEZADO -->
    <!-- ================================================= -->

    <div class="mb-3">
        <p class="text-muted mb-0">
            Administración de Sedes Judiciales del sistema SAJV-QoS.
        </p>
    </div>


    <!-- ================================================= -->
    <!-- MENSAJES -->
    <!-- ================================================= -->

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">

        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">

        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>
    </div>


    <!-- ================================================= -->
    <!-- TARJETA PRINCIPAL -->
    <!-- ================================================= -->

    <div class="card card-primary card-outline">

        <!-- CABECERA -->
        <div class="card-header bg-primary text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3 class="card-title mb-0">
                    <i class="fa-solid fa-building me-2"></i>
                    Listado de Sedes
                </h3>

                <button type="button"
                        class="btn btn-light btn-sm"
                        onclick="abrirModalRegistro()">

                    <i class="fa-solid fa-plus me-1"></i>
                    Nueva Sede

                </button>

            </div>

        </div>


        <!-- CUERPO -->
        <div class="card-body">

            <div class="table-responsive">

                <table id="tablaSedes"
                       class="table table-bordered table-striped table-hover align-middle w-100">

                    <thead class="table-light">

                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Dirección</th>
                        <th>Estado</th>
                        <th class="text-center">Operaciones</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="sede : ${sedes}">

                        <!-- ID -->
                        <td th:text="${sede.id}"></td>

                        <!-- DESCRIPCIÓN -->
                        <td th:text="${sede.descripcion}"></td>

                        <!-- DIRECCIÓN -->
                        <td th:text="${sede.direccion}"></td>

                        <!-- ESTADO -->
                        <td>

                            <span th:if="${sede.estado == 1}"
                                  class="badge text-bg-success">
                                Activo
                            </span>

                            <span th:if="${sede.estado == 0}"
                                  class="badge text-bg-danger">
                                Inactivo
                            </span>

                        </td>

                        <!-- OPERACIONES -->
                        <td class="text-center text-nowrap">

                            <!-- EDITAR -->
                            <button type="button"
                                    class="btn btn-warning btn-sm"
                                    title="Editar"
                                    th:data-id="${sede.id}"
                                    th:data-descripcion="${sede.descripcion}"
                                    th:data-direccion="${sede.direccion}"
                                    onclick="abrirModalEdicion(this)">

                                <i class="fa-solid fa-pen-to-square"></i>

                            </button>


                            <!-- DESACTIVAR -->
                            <form th:if="${sede.estado == 1}"
                                  th:action="@{/sedes/desactivar/{id}(id=${sede.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('¿Está seguro de desactivar esta sede?')">

                                <button type="submit"
                                        class="btn btn-danger btn-sm"
                                        title="Desactivar">

                                    <i class="fa-solid fa-ban"></i>

                                </button>

                            </form>


                            <!-- ACTIVAR -->
                            <form th:if="${sede.estado == 0}"
                                  th:action="@{/sedes/activar/{id}(id=${sede.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('¿Desea activar esta sede?')">

                                <button type="submit"
                                        class="btn btn-success btn-sm"
                                        title="Activar">

                                    <i class="fa-solid fa-check"></i>

                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- PIE -->
        <div class="card-footer">

            <small class="text-muted">
                <i class="fa-solid fa-circle-info me-1"></i>
                Administración de sedes judiciales.
            </small>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- MODAL ÚNICO: REGISTRAR / EDITAR SEDE -->
    <!-- ================================================= -->

    <div class="modal fade"
         id="modalSede"
         tabindex="-1"
         aria-labelledby="tituloModalSede"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <form id="formSede"
                      th:action="@{/sedes/guardar}"
                      th:attr="data-save-url=@{/sedes/guardar},
                               data-edit-url=@{/sedes/editar/}"
                      th:object="${sede}"
                      method="post">

                    <!-- CABECERA DEL MODAL -->
                    <div class="modal-header bg-primary text-white">

                        <h5 class="modal-title"
                            id="tituloModalSede">

                            <i class="fa-solid fa-building me-2"></i>

                            <span id="textoModalSede">
                                Registrar Sede
                            </span>

                        </h5>

                        <button type="button"
                                class="btn-close btn-close-white"
                                data-bs-dismiss="modal"
                                aria-label="Cerrar">
                        </button>

                    </div>


                    <!-- CUERPO DEL MODAL -->
                    <div class="modal-body">

                        <!-- DESCRIPCIÓN -->
                        <div class="mb-3">

                            <label for="descripcion"
                                   class="form-label">

                                Descripción
                                <span class="text-danger">*</span>

                            </label>

                            <input type="text"
                                   th:field="*{descripcion}"
                                   id="descripcion"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"
                                   placeholder="Ingrese la descripción de la sede"
                                   maxlength="100"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}">
                            </div>

                        </div>


                        <!-- DIRECCIÓN -->
                        <div class="mb-3">

                            <label for="direccion"
                                   class="form-label">

                                Dirección

                            </label>

                            <input type="text"
                                   th:field="*{direccion}"
                                   id="direccion"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'"
                                   placeholder="Ingrese la dirección de la sede"
                                   maxlength="200">

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('direccion')}"
                                 th:errors="*{direccion}">
                            </div>

                        </div>

                    </div>


                    <!-- PIE DEL MODAL -->
                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">

                            <i class="fa-solid fa-xmark me-1"></i>
                            Cancelar

                        </button>

                        <button type="submit"
                                class="btn btn-primary"
                                id="btnGuardarSede">

                            <i class="fa-solid fa-floppy-disk me-1"></i>

                            <span id="textoBotonSede">
                                Guardar
                            </span>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
    <script th:inline="javascript">

    document.addEventListener('DOMContentLoaded', function () {

        const modalSedeElement = document.getElementById('modalSede');

        const modalSede = new bootstrap.Modal(modalSedeElement);

        const formSede = document.getElementById('formSede');

        const descripcion = document.getElementById('descripcion');

        const direccion = document.getElementById('direccion');

        const textoModal = document.getElementById('textoModalSede');

        const textoBoton = document.getElementById('textoBotonSede');


        // LIMPIAR VALIDACIONES
        function limpiarErrores() {

            document.querySelectorAll('#formSede .form-control')
                .forEach(function (campo) {

                    campo.classList.remove('is-invalid');

                });

            document.querySelectorAll('#formSede .invalid-feedback')
                .forEach(function (mensaje) {

                    mensaje.innerText = '';

                });

        }


        // CONFIGURAR MODAL PARA REGISTRAR
        window.abrirModalRegistro = function () {

            formSede.reset();

            formSede.action = formSede.getAttribute('action');

            textoModal.innerText = 'Registrar Sede';

            textoBoton.innerText = 'Guardar';

            limpiarErrores();

            modalSede.show();

        };


        // CONFIGURAR MODAL PARA EDITAR
        window.abrirModalEdicion = function (boton) {

            const id = boton.dataset.id;

            formSede.reset();

            formSede.action = formSede.dataset.editUrl + encodeURIComponent(id);

            descripcion.value = boton.dataset.descripcion || '';

            direccion.value = boton.dataset.direccion || '';

            textoModal.innerText = 'Editar Sede';

            textoBoton.innerText = 'Actualizar';

            limpiarErrores();

            modalSede.show();

        };


        // DATOS DE VALIDACIÓN DEVUELTOS POR EL CONTROLADOR
        const abrirModal = /*[[${abrirModal}]]*/ null;

        const idEdicion = /*[[${idEdicion}]]*/ null;


        // REABRIR MODAL CUANDO EXISTEN ERRORES
        if (abrirModal === 'registro' || abrirModal === 'edicion') {

            if (abrirModal === 'edicion' && idEdicion !== null) {

                formSede.action =
                    formSede.dataset.editUrl + encodeURIComponent(idEdicion);

                textoModal.innerText = 'Editar Sede';

                textoBoton.innerText = 'Actualizar';

            } else {

                textoModal.innerText = 'Registrar Sede';

                textoBoton.innerText = 'Guardar';

            }

            // No ejecutar reset: se conservan los valores
            // enviados y los errores de BindingResult.

            modalSede.show();

        }

    });

</script>
</div>
</body>
</html>
