spring.application.name=sajv-qos

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/sajvdbbckp
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Servidor web
server.port=8083

# Zona horaria de la aplicación
spring.jackson.time-zone=America/Lima

# Desactiva la estrategia implícita de nombres físicos de Hibernate si estuviera causando el cambio automático
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Integración con FastAPI
sajv.qos.api-url=http://127.0.0.1:8002

# Configuración QoS Cisco
sajv.qos.class-map=AUDIENCIAS_QOS
sajv.qos.policy-map=POLITICA_QOS_ZAVALA

# Modo simulación
sajv.qos.simulation=true

# Monitoreo TCP independiente del modo de simulación QoS
sajv.monitoreo.tcp.enabled=false

# Cifrado AES-256-GCM
sajv.qos.encryption-key=${SAJV_QOS_ENCRYPTION_KEY}



# AUTOMATIZACION QoS
# Scheduler deshabilitado inicialmente
sajv.qos.scheduler.enabled=true

# Intervalo de evaluación: 30 segundos
sajv.qos.scheduler.interval=30000

# Espera inicial: 15 segundos
sajv.qos.scheduler.initial-delay=15000

# Zona horaria de Perú
spring.jackson.time-zone=America/Lima

#Duración de intervención manual (minutos)
sajv.qos.manual.duration-minutes=10